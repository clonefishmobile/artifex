<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<title>ARTIFEX — Backpack Roguelike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#E74C3C;--red-dark:#C0392B;--red-glow:#FF6B6B;
  --blue:#3498DB;--blue-dark:#2980B9;--blue-glow:#74B9FF;
  --green:#27AE60;--green-dark:#229954;--green-glow:#55EFC4;
  --gold:#F1C40F;--gold-dark:#D4AC0D;
  --bg:#1a1a2e;--text:#e0e0e0;--text-dim:#888;
  --cell-bg:#24242e;--cell-border:#404050;
  --cyan:#00BCD4;--cyan-glow:rgba(0,188,212,.4);
}
html,body{width:100%;height:100svh;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',monospace;overflow:hidden;touch-action:none;user-select:none}
@supports not (height:100svh){html,body{height:calc(100vh - 60px)}}
#game{width:100%;height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden}

/* TITLE */
#title-screen{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(180deg,#0a0a1e,#1a1a3e 50%,#0f3460);z-index:100}
#title-screen h1{font-size:48px;font-weight:900;
  background:linear-gradient(135deg,var(--red),var(--gold),var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:6px;margin-bottom:6px}
#title-screen .subtitle{color:var(--text-dim);font-size:13px;margin-bottom:36px;letter-spacing:2px}
#title-screen button{padding:14px 44px;font-size:18px;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  color:#1a1a2e;border:none;border-radius:12px;cursor:pointer;letter-spacing:2px;
  box-shadow:0 4px 20px rgba(241,196,15,0.4)}
#title-screen .controls-hint{margin-top:28px;color:var(--text-dim);font-size:11px;
  text-align:center;line-height:1.9}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;padding:8px 12px;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(0,0,0,0.8),transparent);z-index:10;height:46px}
#hud .room-info{font-size:12px;color:var(--gold);font-weight:700}
#hud .hp-container{flex:1;margin:0 10px;height:16px;background:#222;border-radius:8px;
  overflow:hidden;border:1px solid #444;position:relative}
#hud .hp-bar{height:100%;border-radius:8px;transition:width .3s}
#hud .hp-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#hud .timer{font-size:15px;font-weight:700;color:var(--text);min-width:32px;text-align:right}
#exp-bar-container{position:absolute;top:46px;left:0;right:0;height:5px;background:#111;z-index:10}
#exp-bar{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));transition:width .5s}
#exp-text{position:absolute;right:8px;top:-1px;font-size:8px;color:var(--gold);font-weight:600}

/* COMBAT CANVAS */
#combat-canvas{position:absolute;inset:0;width:100%;height:100%}

/* LOBBY */
#lobby{position:absolute;inset:0;display:none;flex-direction:column;
  background:linear-gradient(180deg,#1a1a22,#1e1e28 50%,#222230);
  z-index:20;overflow-y:auto}
#lobby.active{display:flex}
#lobby-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px}
#lobby-top .phase-label{font-size:13px;color:var(--blue-glow);font-weight:600;letter-spacing:1px}

/* QUEUE */
#queue-container{display:flex;align-items:center;gap:5px;padding:4px 10px;overflow-x:auto;min-height:62px}
.queue-label{font-size:10px;color:var(--text-dim);white-space:nowrap;writing-mode:vertical-rl}
.queue-item{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:52px;height:52px;border-radius:8px;border:2px solid;cursor:grab;position:relative;
  font-size:22px;flex-shrink:0}
.queue-item .qi-name{font-size:6px;color:rgba(255,255,255,.6);position:absolute;bottom:1px;
  left:0;right:0;text-align:center;white-space:nowrap;overflow:hidden}
.queue-item .qi-tier{position:absolute;top:1px;right:3px;font-size:9px;font-weight:900;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.8)}
.queue-item .qi-shape{position:absolute;top:2px;left:3px;display:grid;gap:1px}
.qi-shape-cell{width:4px;height:4px;border-radius:1px}

/* GRID */
#backpack-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
#grid-wrapper{position:relative;padding:6px;background:rgba(0,0,0,.25);border-radius:10px;
  border:1px solid rgba(255,255,255,.08)}
#grid-container{display:grid;gap:2px}
.grid-cell{width:min(50px,16vw);height:min(50px,16vw);background:var(--cell-bg);border:1.5px solid var(--cell-border);
  border-radius:4px;position:relative;transition:background .15s,border-color .15s}
.grid-cell.hero-cell{background:rgba(100,50,200,.25);border-color:rgba(155,89,182,.6);pointer-events:none}
.grid-cell.hero-cell .cell-icon{font-size:16px;color:rgba(255,255,255,.9)}
.grid-cell.influence-zone{background:rgba(0,188,212,.15)!important;border-color:var(--cyan)!important;
  box-shadow:inset 0 0 8px var(--cyan-glow)}
.grid-cell.influence-source{border-color:var(--gold)!important;box-shadow:0 0 12px rgba(241,196,15,.5)}
.grid-cell.occupied-active{box-shadow:inset 0 0 8px rgba(241,196,15,.3),0 0 6px rgba(241,196,15,.25)}
.grid-cell.merge-right{border-right-color:transparent!important;border-top-right-radius:0;border-bottom-right-radius:0}
.grid-cell.merge-bottom{border-bottom-color:transparent!important;border-bottom-left-radius:0;border-bottom-right-radius:0}
.grid-cell.merge-left{border-left-color:transparent!important;border-top-left-radius:0;border-bottom-left-radius:0}
.grid-cell.merge-top{border-top-color:transparent!important;border-top-left-radius:0;border-top-right-radius:0}
.grid-cell .cell-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:22px;pointer-events:none;z-index:2}
.grid-cell .cell-tier{position:absolute;bottom:1px;right:3px;font-size:8px;font-weight:900;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none;z-index:2}
.grid-cell .cell-name{position:absolute;top:1px;left:2px;right:2px;font-size:6px;color:rgba(255,255,255,.5);
  text-align:center;pointer-events:none;z-index:2;white-space:nowrap;overflow:hidden}
.grid-cell.drop-valid{border-color:var(--green)!important;background:rgba(39,174,96,.2)!important}
.grid-cell.drop-invalid{border-color:var(--red)!important;background:rgba(231,76,60,.15)!important}
.grid-cell.drop-empty{border-color:rgba(241,196,15,.3)}
.influence-float{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9px;
  font-weight:700;color:var(--cyan);white-space:nowrap;pointer-events:none;z-index:5;
  text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* DRAG GHOST */
#drag-ghost{position:fixed;z-index:200;pointer-events:none;display:grid;gap:2px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.7))}
.ghost-cell{width:50px;height:50px;border-radius:4px;opacity:.75}
.ghost-center{display:flex;align-items:center;justify-content:center;font-size:22px}

/* LOBBY ACTIONS */
#lobby-actions{display:flex;justify-content:center;gap:10px;padding:4px 12px 10px}
#lobby-actions button{padding:8px 22px;font-size:13px;font-weight:700;border:2px solid;
  border-radius:8px;cursor:pointer;transition:all .2s}
#summon-btn{background:transparent;border-color:var(--text-dim);color:var(--text-dim)}
#ready-btn{background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-color:var(--gold);color:#1a1a2e}

/* COMBAT SLOT PANEL */
#combat-slot-panel{position:absolute;bottom:0;left:0;right:0;z-index:12;display:none;
  flex-direction:column;align-items:center;gap:6px;padding:8px 6px 12px;
  background:linear-gradient(0deg,rgba(0,0,0,.85) 70%,transparent)}
#combat-slot-panel.active{display:flex}
#combat-reels{display:flex;gap:6px;justify-content:center}
.combat-reel{width:58px;height:64px;border:2px solid #555;border-radius:10px;overflow:hidden;
  background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;transition:border-color .3s,box-shadow .3s}
.combat-reel.spinning{border-color:#888}
.combat-reel.resolved{border-color:var(--gold);box-shadow:0 0 16px rgba(241,196,15,.6)}
.combat-reel.empty-result{border-color:var(--red);box-shadow:0 0 14px rgba(231,76,60,.5)}
.combat-reel.combo-match{border-color:var(--cyan);box-shadow:0 0 20px var(--cyan-glow)}
.combat-reel.resolved:active{transform:scale(.92);opacity:.8}
.combat-reel .cr-icon{font-size:28px;line-height:1}
.combat-reel .cr-name{font-size:7px;color:rgba(255,255,255,.6);max-width:54px;overflow:hidden;
  white-space:nowrap;text-align:center}
.combat-reel .cr-tier{font-size:8px;font-weight:900;position:absolute;bottom:1px;right:3px;
  text-shadow:0 1px 2px rgba(0,0,0,.8)}
@keyframes reelSpin{
  0%{transform:translateY(-12px);opacity:.2}
  50%{transform:translateY(12px);opacity:.2}
  100%{transform:translateY(-12px);opacity:.2}
}
.combat-reel.spinning .cr-icon{animation:reelSpin .1s linear infinite}
@keyframes reelLand{
  0%{transform:scale(1) translateY(-6px);opacity:.6}
  30%{transform:scale(1.35) translateY(2px);opacity:1}
  55%{transform:scale(.9) translateY(-1px)}
  75%{transform:scale(1.1) translateY(0)}
  100%{transform:scale(1) translateY(0)}
}
.combat-reel.landed .cr-icon{animation:reelLand .4s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes reelFlash{
  0%{background:rgba(241,196,15,.4)}
  100%{background:rgba(0,0,0,.6)}
}
.combat-reel.landed{animation:reelFlash .5s ease-out}
@keyframes reelFlashRed{
  0%{background:rgba(231,76,60,.35)}
  100%{background:rgba(0,0,0,.6)}
}
.combat-reel.landed-empty{animation:reelFlashRed .4s ease-out}
#combo-indicator{font-size:14px;font-weight:900;color:var(--cyan);letter-spacing:2px;
  text-shadow:0 0 8px var(--cyan-glow);display:none;margin-top:2px}
#combo-indicator.active{display:block}
#combat-actions{display:flex;gap:8px;margin-top:4px;align-items:center}
#reroll-btn{padding:8px 16px;font-size:12px;font-weight:700;
  background:transparent;color:var(--gold);border:2px solid var(--gold);border-radius:10px;
  cursor:pointer;letter-spacing:1px;transition:all .2s}
#reroll-btn:disabled{opacity:.35;cursor:not-allowed}
#reroll-btn:not(:disabled):active{transform:scale(.92)}
#autobattle-label{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-dim);
  cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid #444}
#autobattle-label input{width:14px;height:14px;accent-color:var(--green)}
#attack-btn{padding:10px 28px;font-size:16px;font-weight:700;
  background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;
  border:2px solid var(--red-glow);border-radius:10px;cursor:pointer;
  letter-spacing:2px;transition:all .2s;opacity:1}
#attack-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.8)}
#attack-btn:not(:disabled):active{transform:scale(.92)}

/* Turn indicator */
#turn-indicator{position:absolute;top:76px;left:50%;transform:translateX(-50%);z-index:12;
  font-size:13px;font-weight:700;padding:4px 16px;border-radius:8px;pointer-events:none;display:none}
#turn-indicator.active{display:block}
#turn-indicator.player-turn{background:rgba(46,204,113,.2);color:#2ECC71;border:1px solid rgba(46,204,113,.4)}
#turn-indicator.enemy-turn{background:rgba(231,76,60,.2);color:#E74C3C;border:1px solid rgba(231,76,60,.4)}

/* Distance layer indicators */
#distance-labels{position:absolute;right:6px;top:56px;z-index:11;display:none;
  flex-direction:column;gap:2px;font-size:9px;font-weight:700}
#distance-labels.active{display:flex}
.dist-label{padding:2px 6px;border-radius:4px;text-align:center}
.dist-label.far{background:rgba(52,152,219,.2);color:var(--blue-glow)}
.dist-label.mid{background:rgba(241,196,15,.2);color:var(--gold)}
.dist-label.close{background:rgba(231,76,60,.2);color:var(--red-glow)}

/* BIG COMBAT LABELS */
.big-label{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:35;
  pointer-events:none;text-align:center;animation:bigLabelAnim 1.2s ease-out forwards}
.big-label .bl-main{font-size:48px;font-weight:900;letter-spacing:4px;
  -webkit-text-stroke:2px rgba(0,0,0,.7);
  text-shadow:0 0 8px rgba(0,0,0,.9),0 4px 16px rgba(0,0,0,.8),0 0 30px currentColor}
.big-label .bl-sub{font-size:16px;font-weight:700;opacity:.9;margin-top:4px;
  -webkit-text-stroke:1px rgba(0,0,0,.6);
  text-shadow:0 0 6px rgba(0,0,0,.9),0 2px 6px rgba(0,0,0,.7)}
@keyframes bigLabelAnim{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  30%{transform:translate(-50%,-50%) scale(0.95)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
  80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-60%) scale(0.9)}
}

/* FLOATS & NOTIFICATIONS */
.float-text{position:absolute;pointer-events:none;font-weight:900;z-index:30;
  -webkit-text-stroke:1.5px rgba(0,0,0,.6);
  text-shadow:0 0 6px rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.5);
  animation:floatBounce 1s ease-out forwards}
@keyframes floatBounce{
  0%{opacity:1;transform:translateY(0) scale(.6)}
  15%{transform:translateY(-10px) scale(1.3)}
  30%{transform:translateY(-5px) scale(1)}
  50%{opacity:1;transform:translateY(-25px) scale(1.05)}
  100%{opacity:0;transform:translateY(-70px) scale(.8)}
}
.float-text.crit{animation:floatCrit 1.2s ease-out forwards}
@keyframes floatCrit{
  0%{opacity:1;transform:translateY(0) scale(.5) rotate(-5deg)}
  12%{transform:translateY(-15px) scale(1.6) rotate(3deg)}
  25%{transform:translateY(-8px) scale(1.2) rotate(-1deg)}
  50%{opacity:1;transform:translateY(-30px) scale(1.1) rotate(0)}
  100%{opacity:0;transform:translateY(-80px) scale(.7) rotate(0)}
}
.notification{position:absolute;top:58px;left:50%;transform:translateX(-50%);padding:6px 16px;
  border-radius:8px;font-size:13px;font-weight:700;z-index:50;pointer-events:none;
  animation:notifAnim 1.5s ease-out forwards}
@keyframes notifAnim{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}
  15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}

/* LOOT DROP */
#loot-drop{display:none;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
#loot-drop.active{display:flex}
#loot-drop .loot-title{font-size:14px;font-weight:700;color:var(--gold);letter-spacing:2px;
  text-shadow:0 2px 6px rgba(0,0,0,.7)}
#loot-cards{display:flex;gap:10px;justify-content:center}
.loot-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;
  background:rgba(0,0,0,.75);border:2px solid;border-radius:12px;min-width:80px;
  animation:lootDrop .5s ease-out backwards;cursor:grab}
.loot-card:nth-child(1){animation-delay:0s}
.loot-card:nth-child(2){animation-delay:.15s}
.loot-card:nth-child(3){animation-delay:.3s}
@keyframes lootDrop{0%{opacity:0;transform:translateY(-60px) scale(.7)}
  60%{transform:translateY(8px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}
.loot-card .lc-icon{font-size:28px}
.loot-card .lc-name{font-size:9px;color:rgba(255,255,255,.7);max-width:70px;text-align:center;
  overflow:hidden;white-space:nowrap}
.loot-card .lc-tier{font-size:10px;font-weight:900;color:#fff}
.loot-card .lc-shape{display:grid;gap:1px}
.lc-shape-cell{width:6px;height:6px;border-radius:1px}

/* TRANSITIONS */
#transition-overlay{position:absolute;inset:0;background:#000;z-index:90;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  opacity:0;pointer-events:none;transition:opacity .4s}
#transition-overlay.active{opacity:1;pointer-events:all}
#transition-overlay .room-title{font-size:20px;font-weight:700;color:var(--blue-glow)}
#transition-overlay .room-desc{font-size:12px;color:var(--text-dim)}

#gameover{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:10px}
#gameover.active{display:flex}
#gameover h2{font-size:26px;font-weight:900}
#gameover .stats{color:var(--text-dim);font-size:13px;text-align:center;line-height:1.8}
#gameover button{margin-top:12px;padding:10px 32px;font-size:14px;font-weight:700;
  background:var(--gold);color:#1a1a2e;border:none;border-radius:8px;cursor:pointer}

.level-up-flash{position:absolute;inset:0;z-index:40;
  background:radial-gradient(circle,rgba(241,196,15,.3),transparent 70%);pointer-events:none;
  animation:lvlFlash 1.2s ease-out forwards}
@keyframes lvlFlash{0%{opacity:1}100%{opacity:0}}
.level-up-text{position:absolute;top:30%;left:50%;transform:translateX(-50%);
  font-size:28px;font-weight:900;color:var(--gold);z-index:41;pointer-events:none;
  text-shadow:0 0 20px rgba(241,196,15,.8);animation:lvlText 1.5s ease-out forwards}
@keyframes lvlText{0%{opacity:0;transform:translateX(-50%) scale(.5)}
  20%{opacity:1;transform:translateX(-50%) scale(1.2)}40%{transform:translateX(-50%) scale(1)}
  80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-40px)}}

#boss-hp-container{position:absolute;top:52px;left:14px;right:14px;height:18px;background:#222;
  border-radius:9px;overflow:hidden;border:1px solid #555;z-index:10;display:none}
#boss-hp-container.active{display:block}
#boss-hp{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--red-dark),var(--red));transition:width .3s}
#boss-name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#wave-counter{position:absolute;top:54px;left:12px;font-size:10px;color:var(--text-dim);z-index:10}

/* MERGE EFFECT */
@keyframes mergeGlow{
  0%{box-shadow:0 0 0 rgba(241,196,15,0);transform:scale(1)}
  15%{box-shadow:0 0 30px rgba(241,196,15,.9);transform:scale(1.15)}
  30%{transform:scale(0.85)}
  50%{box-shadow:0 0 20px rgba(241,196,15,.6);transform:scale(1.1)}
  70%{transform:scale(0.95)}
  100%{box-shadow:0 0 0 rgba(241,196,15,0);transform:scale(1)}
}
.merge-flash{animation:mergeGlow .7s ease-out;position:relative;z-index:5}
@keyframes mergeParticle{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--mx),var(--my)) scale(0)}
}
.merge-particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:10;
  animation:mergeParticle .6s ease-out forwards}
@keyframes mergeBadge{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}
  60%{transform:translate(-50%,-50%) scale(0.9)}
  100%{opacity:0;transform:translate(-50%,-80%) scale(1)}
}
.merge-badge{position:absolute;z-index:20;pointer-events:none;
  font-size:16px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.7);
  animation:mergeBadge 1s ease-out forwards}

/* LEVEL-UP MODAL */
#levelup-modal{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(0,0,0,.88)}
#levelup-modal.active{display:flex}
#levelup-modal .lu-title{font-size:22px;font-weight:900;color:var(--gold);margin-bottom:4px;
  text-shadow:0 0 16px rgba(241,196,15,.6);letter-spacing:3px}
#levelup-modal .lu-subtitle{font-size:12px;color:var(--text-dim);margin-bottom:16px}
#levelup-cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 12px}
.lu-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px;
  background:rgba(30,30,40,.95);border:2px solid var(--gold);border-radius:14px;min-width:100px;
  max-width:120px;cursor:pointer;transition:all .2s;animation:lootDrop .4s ease-out backwards}
.lu-card:nth-child(2){animation-delay:.1s}
.lu-card:nth-child(3){animation-delay:.2s}

  box-shadow:0 0 20px var(--cyan-glow)}
.lu-card .lu-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:1px}
.lu-card .lu-tag.Damage{background:rgba(231,76,60,.2);color:var(--red-glow)}
.lu-card .lu-tag.Defense{background:rgba(52,152,219,.2);color:var(--blue-glow)}
.lu-card .lu-tag.Utility{background:rgba(241,196,15,.2);color:var(--gold)}

.lu-card .lu-desc{font-size:10px;color:var(--text-dim);text-align:center;line-height:1.4}
</style>
</head>
<body>
<div id="game">
  <div id="title-screen">
    <h1>ARTIFEX</h1>
    <div class="subtitle">BACKPACK ROGUELIKE</div>
    <button onclick="startGame()">НАЧАТЬ ИГРУ</button>
    <div class="controls-hint">
      Перетаскивай оружие в сетку 5×6<br>
      Герой занимает центр (2×2)<br>
      В бою: слоты → ATTACK / REROLL
    </div>
  </div>
  <div id="hud" style="display:none">
    <div class="room-info" id="room-info">Ice Castle Lv1 W1/20</div>
    <div class="hp-container">
      <div class="hp-bar" id="hp-bar" style="width:100%;background:linear-gradient(90deg,#27AE60,#2ECC71)"></div>
      <div class="hp-text" id="hp-text">100/100</div>
    </div>
    <div class="timer" id="timer"></div>
  </div>
  <div id="exp-bar-container" style="display:none">
    <div id="exp-bar" style="width:0%"></div>
    <div id="exp-text">Lv 1</div>
  </div>
  <canvas id="combat-canvas"></canvas>
  <div id="boss-hp-container"><div id="boss-hp" style="width:100%"></div><div id="boss-name">Ice Warden</div></div>
  <div id="wave-counter"></div>
  <div id="distance-labels">
    <div class="dist-label far">FAR</div>
    <div class="dist-label mid">MID</div>
    <div class="dist-label close">CLOSE</div>
  </div>
  <div id="lobby">
    <div id="lobby-top"><div class="phase-label">BACKPACK</div></div>
    <div id="backpack-area"><div id="grid-wrapper"><div id="grid-container"></div></div></div>
    <div id="loot-drop">
      <div class="loot-title">LOOT</div>
      <div id="loot-cards"></div>
    </div>
    <div id="lobby-actions">
      <button id="summon-btn" onclick="resummonLoot()">⟳ SUMMON</button>
      <button id="ready-btn" onclick="closeBpOverlay()">⚔ BATTLE</button>
    </div>
  </div>
  <div id="combat-slot-panel">
    <div id="combat-reels"></div>
    <div id="combo-indicator"></div>
    <div id="combat-actions">
      <button id="reroll-btn" disabled onclick="rerollCombatSlots()">⟳ 2/2</button>
      <label id="autobattle-label"><input type="checkbox" id="autobattle-cb" onchange="toggleAutobattle()">AUTO</label>
      <button id="attack-btn" disabled onclick="executeCombatAttack()">⚔ ATTACK</button>
    </div>
  </div>
  <div id="turn-indicator"></div>
  <div id="transition-overlay">
    <div class="room-title" id="trans-title"></div>
    <div class="room-desc" id="trans-desc"></div>

  <div id="levelup-modal">
    <div class="lu-title">LEVEL UP!</div>
    <div class="lu-subtitle">Choose a skill card</div>
    <div id="levelup-cards"></div>
  </div>
  <div id="debug-overlay" style="display:none;position:absolute;inset:0;z-index:999;background:rgba(0,0,0,.9);color:#0f0;font:10px monospace;padding:8px;overflow:auto;white-space:pre-wrap;pointer-events:auto" onclick="this.style.display='none'"></div>
  <div id="gameover">
    <h2>RUN ENDED</h2>
    <div class="stats" id="go-stats"></div>
    <button onclick="restartGame()">НОВЫЙ RUN</button>
  </div>
</div>
<script>
// ===================== CONSTANTS =====================
const GCOLS=5, GROWS=6, CSZ=50, CGAP=2;
const HERO_FOOTPRINT={col:2,row:2,w:2,h:2};
const HERO_CELLS=[{col:2,row:2},{col:3,row:2},{col:2,row:3},{col:3,row:3}];

const TIER_COLORS={1:'#27AE60',2:'#3498DB',3:'#9B59B6',4:'#F39C12',5:'#E74C3C'};
const TIER_NAMES={1:'Common',2:'Rare',3:'Epic',4:'Legendary',5:'Mythic'};
const TIER_SCALING=[1, 2.5, 6.25, 15.6, 39.0];

const COMBO_MULT={2:1.3, 3:1.8, 4:2.5, 5:4.0};

const WEAPON_DEFS=[
  {
    id:'sword', name:'Sword', icon:'⚔', footprint:{w:1,h:1},
    tags:['Melee'], baseDmg:100, cd:1.0,
    influencePattern:'4_cross',
    zoneEffect:{type:'atk_per_match',tag:'Sword',value:0.15},
    distanceCurve:{close:1.0,mid:0.75,far:0.50},
    perks:{1:null,2:'cleave_1',3:'cleave_2'}
  },
  {
    id:'bow', name:'Bow', icon:'🏹', footprint:{w:3,h:1},
    tags:['Ranged','Precise'], baseDmg:100, cd:1.5,
    influencePattern:'6_wide_row',
    zoneEffect:{type:'crit_per_match',tag:'Precise',value:0.05},
    distanceCurve:{close:0.30,mid:0.80,far:1.0},
    perks:{1:null,2:'pierce_1',3:'pierce_2'}
  },
  {
    id:'shotgun', name:'Shotgun', icon:'💥', footprint:{w:2,h:2},
    tags:['Ranged','Heavy'], baseDmg:100, cd:1.8,
    influencePattern:'4_adjacent',
    zoneEffect:{type:'atk_per_match',tag:'Heavy',value:0.10},
    distanceCurve:{close:1.0,mid:1.0,far:0.30},
    perks:{1:null,2:'aoe_radius_1',3:'aoe_radius_2'}
  },
  {
    id:'dagger', name:'Dagger', icon:'🗡', footprint:{w:1,h:1},
    tags:['Melee','Precise'], baseDmg:80, cd:0.8,
    influencePattern:'4_adjacent',
    zoneEffect:{type:'crit_per_match',tag:'Sword',value:0.08},
    distanceCurve:{close:1.0,mid:0.70,far:0.40},
    perks:{1:null,2:'bleed',3:'bleed_strong'}
  }
];

// ===================== STAGE 2: BIOME & SKILL DEFS =====================
const BIOME_DEFS = {
  ice_castle: {
    name: 'Ice Castle',
    levels: 3,
    wavesPerLevel: 20,
    enemyTypes: ['melee', 'ranged', 'elite'],
    bossType: 'boss'
  }
};

const SKILL_DEFS = [
  {id:'vampirism',name:'Vampirism',tag:'Damage',effect:'lifesteal',value:0.20,compatible:'all',desc:'+20% lifesteal'},
  {id:'pierce',name:'Pierce',tag:'Damage',effect:'pierce',value:1,compatible:'precise',desc:'+1 pierce (Precise only)'},
  {id:'critical',name:'Critical',tag:'Damage',effect:'crit_chance',value:0.20,compatible:'all',desc:'+20% crit chance'},
  {id:'frost',name:'Frost',tag:'Damage',effect:'slow_on_hit',value:0.50,compatible:'ranged',desc:'Slow enemies (Ranged only)'},
  {id:'sturdy',name:'Sturdy',tag:'Defense',effect:'max_hp_pct',value:0.20,compatible:'hero',desc:'+20% Hero max HP'},
  {id:'quickdraw',name:'Quickdraw',tag:'Utility',effect:'reroll_cd',value:1,compatible:'hero',desc:'+1 reroll charge'}
];

const COMBO_XP_MUL = {2:1, 3:3, 4:6, 5:10};
const TIER_XP_MUL = {1:1.0, 2:1.3, 3:1.7, 4:2.2, 5:3.0};

function tierColor(t){return TIER_COLORS[t]||'#888'}
function tierColorRgba(t,a){
  var m={'#27AE60':'39,174,96','#3498DB':'52,152,219','#9B59B6':'155,89,182','#F39C12':'243,156,18','#E74C3C':'231,76,60'};
  return 'rgba('+(m[tierColor(t)]||'136,136,136')+','+a+')';
}
function tierEffMul(t){return TIER_SCALING[(t||1)-1]||1}

function isHeroCell(col,row){
  return HERO_CELLS.some(function(c){return c.col===col&&c.row===row});
}

// ===================== GAME STATE =====================
var G={};
var uidCounter=0;
function resetState(){
  G={
    phase:'title',sub:'walk',
    run: {
      biome: 'ice_castle',
      currentLevel: 1,
      currentWave: 1,
      xp: 0,
      runLevel: 1,
      xpToNext: 50,
      waveXpThisTurn: 0,
      completed: false
    },
    hero:{hp:100,maxHp:100,damage:12,level:1,exp:0,expNext:100,crit:0.15},
    grid:Array(GCOLS*GROWS).fill(null),
    placed:new Map(),
    queue:[],
    enemies:[],projectiles:[],effects:[],
    kills:0,totalDamage:0,wavesCleared:0,
    shakeAmount:0,shakeTime:0,_heroDmgFlash:0,
    _comboCount:0,_comboTimer:0,
    lastTime:0,running:false,
    bgScrollY:0,walkSpeed:0,_cityDrift:0,
    // Walking/wave state
    _walkTimer:0,
    _approachTimer:0,
    _approachActive:false,
    _spawnedThisWalk:false,
    // Combat turn state
    _turnPhase:'idle',
    _combatSlots:null,
    _comboMult:1,
    _comboWeapons:{},
    // Autobattle & reroll
    autobattle:false,
    rerollCharges:2,
    rerollMax:2,
    // Target
    targetEnemy:null,
    // Loot
    _lootItems:[],
    _lootTimer:0,
    // Stage 2: Skills
    ownedSkillCards:['vampirism','pierce','critical','frost','sturdy','quickdraw'],
    activeSkills:[],  // {skillId, targetUid:'hero'|weaponUid}
    _levelUpPending:false,
    // Boss phase tracking
    _bossPhase:1,
    _bossMinionsSpawned:false,
  };
}

// ===================== WEAPON HELPERS =====================
function createWeapon(defId,tier){
  var d=WEAPON_DEFS.find(function(w){return w.id===defId});
  if(!d)return null;
  var shape=[];
  for(var r=0;r<d.footprint.h;r++)
    for(var c=0;c<d.footprint.w;c++)
      shape.push([c,r]);
  return{uid:++uidCounter,defId:d.id,name:d.name,icon:d.icon,
    shape:shape,tier:tier||1,footprint:d.footprint,
    tags:d.tags,baseDmg:d.baseDmg,cd:d.cd,
    influencePattern:d.influencePattern,
    zoneEffect:d.zoneEffect,
    distanceCurve:d.distanceCurve,
    perks:d.perks,
    rotation:0};
}

function randomWeapon(level){
  var defIdx=Math.floor(Math.random()*WEAPON_DEFS.length);
  var defId=WEAPON_DEFS[defIdx].id;
  var tier=1;
  var tr=Math.random();
  var lvlBonus=(level||0)*0.03;
  if(tr>0.92-lvlBonus)tier=3;
  else if(tr>0.7-lvlBonus)tier=2;
  return createWeapon(defId,tier);
}

function getShape(weapon){
  var d=WEAPON_DEFS.find(function(w){return w.id===weapon.defId});
  if(!d)return weapon.shape||[[0,0]];
  var shape=[];
  for(var r=0;r<d.footprint.h;r++)
    for(var c=0;c<d.footprint.w;c++)
      shape.push([c,r]);
  return shape;
}

function shapeBounds(shape){
  return{w:Math.max.apply(null,shape.map(function(p){return p[0]}))+1,
         h:Math.max.apply(null,shape.map(function(p){return p[1]}))+1};
}

function getShapeCenter(shape){
  var ax=0,ay=0;
  for(var i=0;i<shape.length;i++){ax+=shape[i][0];ay+=shape[i][1]}
  ax/=shape.length;ay/=shape.length;
  var best=shape[0],bd=99;
  for(var i=0;i<shape.length;i++){
    var d=Math.abs(shape[i][0]-ax)+Math.abs(shape[i][1]-ay);
    if(d<bd){bd=d;best=shape[i]}
  }
  return best;
}

function canPlace(shape,col,row,ignoreUid){
  for(var i=0;i<shape.length;i++){
    var c=col+shape[i][0],r=row+shape[i][1];
    if(c<0||c>=GCOLS||r<0||r>=GROWS)return false;
    if(isHeroCell(c,r))return false;
    var occ=G.grid[r*GCOLS+c];
    if(occ!==null&&occ!==ignoreUid)return false;
  }
  return true;
}

function placeWeapon(weapon,col,row){
  var shape=getShape(weapon);
  weapon.anchorCol=col;weapon.anchorRow=row;weapon.placedShape=shape;
  for(var i=0;i<shape.length;i++)
    G.grid[(row+shape[i][1])*GCOLS+(col+shape[i][0])]=weapon.uid;
  G.placed.set(weapon.uid,weapon);
}

function removeWeapon(uid){
  var w=G.placed.get(uid);if(!w)return null;
  for(var i=0;i<w.placedShape.length;i++)
    G.grid[(w.anchorRow+w.placedShape[i][1])*GCOLS+(w.anchorCol+w.placedShape[i][0])]=null;
  G.placed.delete(uid);
  return w;
}

// ===================== INFLUENCE SYSTEM =====================
function getInfluenceCells(weapon){
  var cells=[];
  var ac=weapon.anchorCol,ar=weapon.anchorRow;
  var fp=weapon.footprint||{w:1,h:1};
  var pattern=weapon.influencePattern;
  if(pattern==='4_cross'){
    var dirs=[[-1,0],[1,0],[0,-1],[0,1]];
    for(var i=0;i<dirs.length;i++){
      var nc=ac+dirs[i][0],nr=ar+dirs[i][1];
      if(nc>=0&&nc<GCOLS&&nr>=0&&nr<GROWS)cells.push({col:nc,row:nr});
    }
  }else if(pattern==='4_adjacent'){
    var cx=ac+Math.floor(fp.w/2),cy=ar+Math.floor(fp.h/2);
    var outerDirs=[[0,-1],[0,fp.h],[-1,0],[fp.w,0]];
    for(var i=0;i<outerDirs.length;i++){
      var nc=ac+outerDirs[i][0],nr=ar+outerDirs[i][1];
      if(nc>=0&&nc<GCOLS&&nr>=0&&nr<GROWS&&!isHeroCell(nc,nr))cells.push({col:nc,row:nr});
    }
    if(fp.w===2&&fp.h===2){
      var extra=[[0,-1],[1,-1],[0,2],[1,2],[-1,0],[-1,1],[2,0],[2,1]];
      cells=[];
      for(var i=0;i<extra.length;i++){
        var nc=ac+extra[i][0],nr=ar+extra[i][1];
        if(nc>=0&&nc<GCOLS&&nr>=0&&nr<GROWS&&!isHeroCell(nc,nr))cells.push({col:nc,row:nr});
      }
    }
  }else if(pattern==='6_wide_row'){
    for(var c=0;c<fp.w;c++){
      var topR=ar-1,botR=ar+fp.h;
      if(topR>=0)cells.push({col:ac+c,row:topR});
      if(botR<GROWS)cells.push({col:ac+c,row:botR});
    }
  }
  return cells;
}

function getHeroInfluenceCells(){
  var cells=[];
  var hc=HERO_FOOTPRINT.col,hr=HERO_FOOTPRINT.row;
  for(var r=hr-1;r<=hr+HERO_FOOTPRINT.h;r++){
    for(var c=hc-1;c<=hc+HERO_FOOTPRINT.w;c++){
      if(c<0||c>=GCOLS||r<0||r>=GROWS)continue;
      if(isHeroCell(c,r))continue;
      if(r===hr-1||r===hr+HERO_FOOTPRINT.h||c===hc-1||c===hc+HERO_FOOTPRINT.w){
        cells.push({col:c,row:r});
      }
    }
  }
  return cells;
}

function computeInfluenceBuff(weapon){
  var buff={atk:1.0,crit:0};
  var heroZone=getHeroInfluenceCells();
  var wCells=[];
  var shape=weapon.placedShape||getShape(weapon);
  for(var i=0;i<shape.length;i++)wCells.push({col:weapon.anchorCol+shape[i][0],row:weapon.anchorRow+shape[i][1]});

  var inHeroZone=wCells.some(function(wc){
    return heroZone.some(function(hz){return hz.col===wc.col&&hz.row===wc.row});
  });
  if(inHeroZone)buff.atk+=0.20;

  G.placed.forEach(function(other){
    if(other.uid===weapon.uid)return;
    var zone=getInfluenceCells(other);
    var overlap=wCells.some(function(wc){
      return zone.some(function(zc){return zc.col===wc.col&&zc.row===wc.row});
    });
    if(!overlap)return;
    var eff=other.zoneEffect;
    if(!eff)return;
    if(eff.type==='atk_per_match'){
      if(weapon.tags&&weapon.tags.indexOf(eff.tag)>=0)buff.atk+=eff.value;
      else buff.atk+=eff.value*0.5;
    }else if(eff.type==='crit_per_match'){
      if(weapon.tags&&weapon.tags.indexOf(eff.tag)>=0)buff.crit+=eff.value;
      else buff.crit+=eff.value*0.5;
    }
  });
  return buff;
}

function computeFinalStats(weapon){
  var tierMul=tierEffMul(weapon.tier);
  var buff=computeInfluenceBuff(weapon);
  // Apply active skill: critical adds crit chance
  var skillCritBonus=0;
  for(var i=0;i<G.activeSkills.length;i++){
    var sk=G.activeSkills[i];
    var def=SKILL_DEFS.find(function(s){return s.id===sk.skillId});
    if(!def)continue;
    if(def.effect==='crit_chance')skillCritBonus+=def.value;
  }
  return{
    damage:weapon.baseDmg*tierMul*buff.atk,
    crit:G.hero.crit+buff.crit+skillCritBonus
  };
}

// ===================== RUN XP SYSTEM =====================
function xpThreshold(level){
  return Math.floor(50 * Math.pow(1.5, level - 1));
}

function gainRunXp(amount){
  G.run.xp += amount;
  while(G.run.xp >= G.run.xpToNext){
    G.run.xp -= G.run.xpToNext;
    G.run.runLevel++;
    G.run.xpToNext = xpThreshold(G.run.runLevel);
    G._levelUpPending = true;
  }
  updateRunXpBar();
}

function updateRunXpBar(){
  var pct=G.run.xpToNext>0?(G.run.xp/G.run.xpToNext*100):0;
  document.getElementById('exp-bar').style.width=pct+'%';
  document.getElementById('exp-text').textContent='Lv '+G.run.runLevel;
}

// ===================== HERO EXP (legacy, still used for hero stat growth) =====================
function gainExp(n){
  G.hero.exp+=n;
  while(G.hero.exp>=G.hero.expNext){
    G.hero.exp-=G.hero.expNext;G.hero.level++;
    G.hero.maxHp+=5;G.hero.hp=Math.min(G.hero.hp+5,G.hero.maxHp);
    G.hero.damage+=1;G.hero.expNext=Math.floor(100*Math.pow(1.2,G.hero.level-1));
    showLevelUp();
  }
}

// ===================== LEVEL-UP SKILL CHOICE =====================
function getCompatibleSkills(){
  var hasPrecise=false,hasRanged=false;
  G.placed.forEach(function(w){
    if(w.tags.indexOf('Precise')>=0)hasPrecise=true;
    if(w.tags.indexOf('Ranged')>=0)hasRanged=true;
  });
  return SKILL_DEFS.filter(function(sk){
    if(sk.compatible==='all'||sk.compatible==='hero')return true;
    if(sk.compatible==='precise'&&hasPrecise)return true;
    if(sk.compatible==='ranged'&&hasRanged)return true;
    return false;
  });
}

function showLevelUpChoice(){
  var compatible=getCompatibleSkills();
  // Shuffle and pick 3
  var shuffled=compatible.slice();
  for(var i=shuffled.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=tmp;
  }
  var choices=shuffled.slice(0,3);
  if(choices.length===0)return; // no skills available

  var container=document.getElementById('levelup-cards');
  container.innerHTML='';
  for(var i=0;i<choices.length;i++){
    var sk=choices[i];
    var card=document.createElement('div');card.className='lu-card';
    card.innerHTML='<div class="lu-tag '+sk.tag+'">'+sk.tag+'</div>'
      +'<div class="lu-name">'+sk.name+'</div>'
      +'<div class="lu-desc">'+sk.desc+'</div>';
    (function(idx){
      card.addEventListener('click',function(){selectSkillCard(idx,choices)});
    })(i);
    container.appendChild(card);
  }
  document.getElementById('levelup-modal').classList.add('active');
}

function selectSkillCard(idx,choices){
  var sk=choices[idx];
  if(!sk)return;
  G.activeSkills.push({skillId:sk.id,targetUid:'hero'});
  applySkillEffect(sk);
  document.getElementById('levelup-modal').classList.remove('active');
  G._levelUpPending=false;
  showNotif('SKILL: '+sk.name,'#F1C40F');
  // Resume combat — start next wave
  document.getElementById('combat-slot-panel').classList.remove('active');
  document.getElementById('distance-labels').classList.remove('active');
  setTimeout(function(){startWalking()},500);
}

function applySkillEffect(sk){
  if(sk.effect==='max_hp_pct'){
    var bonus=Math.floor(G.hero.maxHp*sk.value);
    G.hero.maxHp+=bonus;
    G.hero.hp+=bonus;
  }else if(sk.effect==='reroll_cd'){
    G.rerollMax+=Math.floor(sk.value);
    G.rerollCharges=G.rerollMax;
  }
  // lifesteal, crit_chance, pierce, slow_on_hit are applied dynamically during combat
}

function hasActiveSkill(skillId){
  return G.activeSkills.some(function(s){return s.skillId===skillId});
}

function getActiveSkillValue(skillId){
  var count=0;
  for(var i=0;i<G.activeSkills.length;i++){
    if(G.activeSkills[i].skillId===skillId)count++;
  }
  var def=SKILL_DEFS.find(function(s){return s.id===skillId});
  return def?def.value*count:0;
}

// ===================== AUDIO SYSTEM =====================
var audioCtx=null;
function initAudio(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
}

function sfxHit(){
  if(!audioCtx)return;var t=audioCtx.currentTime;
  var buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.08,audioCtx.sampleRate);

function loadAssets(cb){
  var loaded=0,total=Object.keys(BG_ASSETS).length;
  for(var _k in BG_ASSETS){
    if(!BG_ASSETS.hasOwnProperty(_k))continue;
    (function(key,src){
      var img=new Image();
      img.onload=function(){dlog('asset OK: '+src);if(++loaded>=total)cb()};
      img.onerror=function(){dlog('asset FAIL: '+src);if(++loaded>=total)cb()};
      img.src=src;BG_IMG[key]=img;
    })(_k,BG_ASSETS[_k]);
  }
  if(total===0)cb();
}

const canvas=document.getElementById('combat-canvas');
const ctx=canvas.getContext('2d');
var CW,CH;
function resizeCanvas(){
  var g=document.getElementById('game');CW=canvas.width=g.clientWidth;CH=canvas.height=g.clientHeight;
}

function drawCombat(dt){
  ctx.clearRect(0,0,CW,CH);
  if(G.walkSpeed>0){
    G.bgScrollY=(G.bgScrollY+G.walkSpeed*dt*0.6)%200;
    G._cityDrift=((G._cityDrift||0)+G.walkSpeed*dt*0.03)%CW;
  }
  ctx.save();
  drawLayerSky();drawLayerCity();drawLayerHaze();drawLayerPath();
  drawDistanceZones();
  drawEnemies(dt);drawProjectiles();drawEffects();
  ctx.restore();
  // Hero damage vignette
  if(G._heroDmgFlash>0){
    G._heroDmgFlash-=dt*1.5;
    var alpha=Math.min(G._heroDmgFlash*0.8,0.55);
    var vg=ctx.createRadialGradient(CW/2,CH/2,CH*.1,CW/2,CH/2,CH*.6);
    vg.addColorStop(0,'rgba(255,0,0,0)');vg.addColorStop(1,'rgba(180,0,0,'+alpha+')');
    ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);
  }
  // Walking indicator
  if(G.sub==='walk'){
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='bold 10px monospace';ctx.textAlign='center';
    ctx.fillText('WALKING...',CW/2,CH-40);
  }
}

// ===================== BACKGROUND LAYERS =====================
function drawLayerSky(){
  var img=BG_IMG.bgSky;
  if(img&&img.complete&&img.naturalWidth>0){ctx.drawImage(img,0,0,CW,CH*0.5)}
  else{var g=ctx.createLinearGradient(0,0,0,CH*0.5);g.addColorStop(0,'#7a8fa6');g.addColorStop(1,'#b0c4d8');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH*0.5)}
}
function drawLayerCity(){
  var img=BG_IMG.bgCity;if(!img||!img.complete||img.naturalWidth<=0)return;
  var drift=G._cityDrift||0;ctx.drawImage(img,-drift,CH*0.30,CW+drift,CH*0.20);
}
function drawLayerHaze(){
  var haze=ctx.createLinearGradient(0,CH*0.46,0,CH*0.52);
  haze.addColorStop(0,'rgba(200,215,230,0)');haze.addColorStop(1,'rgba(200,215,230,0.5)');
  ctx.fillStyle=haze;ctx.fillRect(0,CH*0.46,CW,CH*0.06);
}
function drawLayerPath(){
  var img=BG_IMG.bgPath;var pathTop=CH*0.48;var pathH=CH-pathTop;
  if(img&&img.complete&&img.naturalWidth>0){
    var srcY=img.naturalHeight*0.45;var srcH=img.naturalHeight*0.55;
    var pulse=G.walkSpeed>0?Math.sin(G.bgScrollY*0.1)*3:0;
    ctx.drawImage(img,0,srcY,img.naturalWidth,srcH,0,pathTop-pulse,CW,pathH+pulse);
    if(G.walkSpeed>0){
      ctx.save();ctx.globalAlpha=0.12;ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.setLineDash([12,20]);ctx.lineDashOffset=-G.bgScrollY*3;
      ctx.beginPath();ctx.moveTo(CW*0.5,pathTop);ctx.lineTo(CW*0.5,CH);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    }
  }else{
    var g=ctx.createLinearGradient(0,pathTop,0,CH);g.addColorStop(0,'#4a5a6a');g.addColorStop(1,'#2a3a4a');
    ctx.fillStyle=g;ctx.fillRect(0,pathTop,CW,pathH);
  }

function drawDistanceZones(){
  if(G.sub!=='fight')return;
  ctx.save();ctx.globalAlpha=0.06;
  ctx.fillStyle='#3498DB';ctx.fillRect(0,CH*0.25,CW,CH*0.15);
  ctx.fillStyle='#F1C40F';ctx.fillRect(0,CH*0.42,CW,CH*0.15);
  ctx.fillStyle='#E74C3C';ctx.fillRect(0,CH*0.58,CW,CH*0.15);

// ===================== ENEMY RENDERING =====================
function enemyScreenPos(e){
  var baseY,scale;
  if(e.distance==='far'){baseY=CH*0.32;scale=0.5}
  else if(e.distance==='mid'){baseY=CH*0.49;scale=0.7}
  else{baseY=CH*0.64;scale=0.9}

  var sameD=G.enemies.filter(function(en){return en.hp>0&&en.distance===e.distance});
  var idx=sameD.indexOf(e);var count=sameD.length;
  if(idx<0){idx=0;count=1}
  var x;
  if(count<=1)x=CW*0.5;
  else if(count===2)x=CW*(idx===0?0.35:0.65);
  else x=CW*(0.2+0.6*idx/(count-1));

  var approachScale=e._approachScale!==undefined?e._approachScale:1;
  var imgW=CW*0.25*scale*approachScale;
  var imgH=imgW;
  return{x:x||CW*0.5,y:baseY,imgW:imgW||50,imgH:imgH||50,size:(imgW||50)/2,scale:scale};
}

function drawEnemies(dt){
  dt=dt||0.016;
  var alive=G.enemies.filter(function(en){return en.hp>0});
  var now=Date.now()*0.001;
  for(var si=0;si<alive.length;si++){
    var e=alive[si];
    if(e.opacity<=0)continue;
    var pos=enemyScreenPos(e);
    e._idlePhase=(e._idlePhase||0)+dt*2.5;
    if(e._hitShakeX){e._hitShakeX*=0.85;if(Math.abs(e._hitShakeX)<0.3)e._hitShakeX=0}
    if(e._hitShakeY){e._hitShakeY*=0.85;if(Math.abs(e._hitShakeY)<0.3)e._hitShakeY=0}
    var breathScale=1+Math.sin(e._idlePhase*1.2)*0.02;
    var idleSway=Math.sin(e._idlePhase*0.7+e.id)*2.5;
    var drawX=pos.x+(e._hitShakeX||0)+idleSway;
    var drawY=pos.y+(e._hitShakeY||0)+Math.sin(e._idlePhase)*2;
    var drawW=pos.imgW*breathScale;var drawH=pos.imgH*breathScale;
    ctx.save();ctx.globalAlpha=e.opacity;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();
    ctx.ellipse(drawX,pos.y+pos.imgH*0.42,pos.imgW*0.35,pos.imgH*0.06,0,0,Math.PI*2);ctx.fill();
    // Sprite
    var eimg=getEnemyImg(e);
    if(eimg.complete&&eimg.naturalWidth>0){
      if(e._hitFlash>0){ctx.filter='brightness('+(1+e._hitFlash*5)+')';e._hitFlash=Math.max(0,e._hitFlash-dt*1.5)}
      ctx.drawImage(eimg,drawX-drawW/2,drawY-drawH/2,drawW,drawH);
      ctx.filter='none';
    }else{
      ctx.fillStyle=e.type==='boss'?'#4466aa':'#556688';
      ctx.fillRect(drawX-pos.imgW/3,drawY-pos.imgH/3,pos.imgW*0.66,pos.imgH*0.66);
    }
    // HP bar
    var barW=pos.imgW*0.8,barH=Math.max(6,8*pos.scale);
    var barX=drawX-barW/2,barY=drawY-pos.imgH/2-barH-8;
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(barX-1,barY-1,barW+2,barH+2);
    var hp=e.hp/e.maxHp;
    ctx.fillStyle=hp>0.5?'#2ECC71':hp>0.25?'#F1C40F':'#E74C3C';
    ctx.fillRect(barX,barY,barW*hp,barH);
    ctx.fillStyle='#fff';ctx.font='bold '+Math.max(9,Math.floor(11*pos.scale))+'px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(Math.ceil(e.hp)+'/'+e.maxHp,drawX,barY+barH/2);
    // Type label
    if(e.type==='boss'||e.type==='elite'){
      ctx.fillStyle=e.type==='boss'?'#ffaa44':'#cc88ff';
      ctx.font='bold '+Math.max(10,Math.floor(12*pos.scale))+'px sans-serif';
      ctx.fillText(e.type==='boss'?'BOSS':'ELITE',drawX,barY-10);
    }
    // Target indicator
    if(G.targetEnemy===e){
      ctx.strokeStyle='#F1C40F';ctx.lineWidth=2;
      ctx.strokeRect(drawX-drawW/2-3,drawY-drawH/2-3,drawW+6,drawH+6);
    }
    // Distance label
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='8px monospace';
    ctx.fillText(e.distance,drawX,drawY+pos.imgH/2+4);
    ctx.restore();
  }
}

function drawProjectiles(){
  for(var i=0;i<G.projectiles.length;i++){
    var p=G.projectiles[i];
    var sz=p.size||4;
    // Trail
    ctx.save();ctx.globalAlpha=0.3;
    ctx.fillStyle=p.color||'#F1C40F';ctx.beginPath();
    ctx.arc(p.x-p.vx*0.02,p.y-p.vy*0.02,sz*0.7,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.15;ctx.beginPath();
    ctx.arc(p.x-p.vx*0.04,p.y-p.vy*0.04,sz*0.4,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // Main body
    ctx.fillStyle=p.color||'#F1C40F';ctx.beginPath();
    ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();
    // Glow
    ctx.save();ctx.globalAlpha=0.4;
    ctx.shadowColor=p.color||'#F1C40F';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,sz*0.6,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawEffects(){
  for(var i=G.effects.length-1;i>=0;i--){
    var ef=G.effects[i];ef.timer-=0.016;
    if(ef.timer<=0){G.effects.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=ef.timer/ef.maxTimer;
    ctx.strokeStyle=ef.color;ctx.lineWidth=2;ctx.beginPath();
    ctx.arc(ef.x,ef.y,ef.radius*(1-ef.timer/ef.maxTimer)*2,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
}

// ===================== ENEMY SYSTEM =====================
var _enemyIdCounter=0;
function spawnEnemy(type,dist){
  _enemyIdCounter++;
  var levelScale=1+(G.run.currentLevel-1)*0.5+(G.run.currentWave-1)*0.05;
  var hp,dmg;
  if(type==='melee'){hp=120*levelScale;dmg=8*levelScale}
  else if(type==='ranged'){hp=80*levelScale;dmg=12*levelScale}
  else if(type==='elite'){hp=300*levelScale;dmg=15*levelScale}
  else if(type==='boss'){hp=900*levelScale*3;dmg=25*levelScale}
  else{hp=90;dmg=5}
  return{
    id:_enemyIdCounter,type:type,
    hp:hp,maxHp:hp,damage:dmg,
    distance:dist||'mid',
    opacity:1,_approachScale:1,
    _hitFlash:0,_hitShakeX:0,_hitShakeY:0,_idlePhase:Math.random()*6,
    imgIdx:Math.floor(Math.random()*2)
  };
}

// ===================== WAVE GENERATION (Procedural) =====================
function generateWaveEnemies(level, waveNum){
  var biome=BIOME_DEFS[G.run.biome];
  var maxLevel=biome.levels;
  var maxWave=biome.wavesPerLevel;

  // Wave 20 of last level = boss
  if(waveNum===maxWave && level===maxLevel){
    return [{t:'boss',dist:'close'}];
  }
  // Wave 20 of non-last level = level-clear (stronger elite)
  if(waveNum===maxWave){
    return [{t:'elite',dist:'mid'},{t:'melee',dist:'close'},{t:'melee',dist:'close'}];
  }

  var enemies=[];
  var dists=['close','mid','far'];

  if(waveNum<=5){
    // Waves 1-5: 1-2 melee close/mid
    var count=1+Math.floor(Math.random()*2);
    for(var i=0;i<count;i++){
      enemies.push({t:'melee',dist:dists[Math.floor(Math.random()*2)]});
    }
  }else if(waveNum<=10){
    // Waves 6-10: 2-3 mixed
    var count=2+Math.floor(Math.random()*2);
    for(var i=0;i<count;i++){
      var type=Math.random()<0.3?'ranged':'melee';
      enemies.push({t:type,dist:dists[Math.floor(Math.random()*3)]});
    }
  }else if(waveNum<=15){
    // Waves 11-15: 2-3 with possible elite
    var count=2+Math.floor(Math.random()*2);
    var hasElite=Math.random()<0.4;
    for(var i=0;i<count;i++){
      var type=(i===0&&hasElite)?'elite':(Math.random()<0.3?'ranged':'melee');
      enemies.push({t:type,dist:dists[Math.floor(Math.random()*3)]});
    }
  }else{
    // Waves 16-19: 3-4 mixed heavy
    var count=3+Math.floor(Math.random()*2);
    for(var i=0;i<count;i++){
      var roll=Math.random();
      var type=roll<0.2?'elite':roll<0.5?'ranged':'melee';
      enemies.push({t:type,dist:dists[Math.floor(Math.random()*3)]});
    }
  }
  return enemies;
}

function spawnWaveEnemies(){
  var waveData=generateWaveEnemies(G.run.currentLevel,G.run.currentWave);
  G.enemies=[];
  for(var i=0;i<waveData.length;i++){
    var e=spawnEnemy(waveData[i].t,waveData[i].dist);
    e._approachScale=0.3;
    G.enemies.push(e);
  }
  G._approachActive=true;G._approachTimer=0;
  // Boss HP bar
  var hasBoss=waveData.some(function(d){return d.t==='boss'});
  if(hasBoss){
    document.getElementById('boss-hp-container').classList.add('active');
    G._bossPhase=1;G._bossMinionsSpawned=false;
  }
  dlog('spawned wave Lv'+G.run.currentLevel+' W'+G.run.currentWave+' with '+waveData.length+' enemies');
}

// ===================== WALKING / COMBAT UPDATE =====================
function startWalking(){
  G.sub='walk';G._walkTimer=0;G.walkSpeed=80;
  G.enemies=[];G.projectiles=[];G.effects=[];
  G._turnPhase='idle';G.targetEnemy=null;
  G._approachActive=false;G._approachTimer=0;
  G._spawnedThisWalk=false;
  G.rerollCharges=G.rerollMax;
  G.run.waveXpThisTurn=0;
  document.getElementById('combat-slot-panel').classList.remove('active');
  document.getElementById('distance-labels').classList.remove('active');
  document.getElementById('boss-hp-container').classList.remove('active');
  var indicator=document.getElementById('turn-indicator');indicator.className='';
  startBgm('battle');
}

function updateWalking(dt){
  G._walkTimer+=dt;
  // Shorter walk between waves (0.5s), longer at start (1s)
  var walkDelay=G.run.currentWave===1?1.0:0.5;
  if(G._walkTimer>=walkDelay&&!G._approachActive&&!G._spawnedThisWalk){
    G._spawnedThisWalk=true;
    spawnWaveEnemies();
  }
  if(G._approachActive){
    G._approachTimer+=dt;
    var done=true;
    for(var i=0;i<G.enemies.length;i++){
      var e=G.enemies[i];
      if(e._approachScale<1){e._approachScale=Math.min(1,e._approachScale+dt*0.5);done=false}
    }
    if(done||G._approachTimer>2.5){
      G._approachActive=false;G.sub='fight';G.walkSpeed=0;
      document.getElementById('distance-labels').classList.add('active');
      updateWaveCounter();
      startCombatSlots();
      dlog('fight started, Lv'+G.run.currentLevel+' W'+G.run.currentWave);
    }
  }
}

function updateCombat(dt){
  if(G.phase!=='combat')return;
  if(G.sub==='walk'){updateWalking(dt);return}
  if(G.sub!=='fight')return;

  // Shake decay
  if(G.shakeTime>0){G.shakeTime-=dt;if(G.shakeTime<=0)G.shakeAmount=0}

  // Move projectiles
  for(var i=G.projectiles.length-1;i>=0;i--){
    var p=G.projectiles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)G.projectiles.splice(i,1);
  }

  // Boss phase check
  updateBossPhase();

  // Check all enemies dead
  var allDead=G.enemies.length>0&&G.enemies.every(function(e){return e.hp<=0});
  if(allDead&&G._turnPhase!=='wave_clearing'&&G._turnPhase!=='idle'){
    G._turnPhase='wave_clearing';
    document.getElementById('attack-btn').disabled=true;
    document.getElementById('reroll-btn').disabled=true;
    setTimeout(function(){onWaveCleared()},600);
  }

  // Update HUD
  updateHUD();
  // Update boss HP bar
  updateBossHpBar();
}

function updateBossPhase(){
  var boss=G.enemies.find(function(e){return e.type==='boss'&&e.hp>0});
  if(!boss)return;
  var hpPct=boss.hp/boss.maxHp;
  if(hpPct<=0.66&&G._bossPhase<2){
    G._bossPhase=2;
    boss.damage*=1.5;
    showNotif('BOSS PHASE 2 - +50% DMG!','#F39C12');
  }
  if(hpPct<=0.33&&G._bossPhase<3){
    G._bossPhase=3;
    showNotif('BOSS PHASE 3 - SUMMONS MINION!','#E74C3C');
    if(!G._bossMinionsSpawned){
      G._bossMinionsSpawned=true;
      var minion=spawnEnemy('melee','mid');
      minion._approachScale=1;
      G.enemies.push(minion);
    }
  }
}

function updateBossHpBar(){
  var boss=G.enemies.find(function(e){return e.type==='boss'&&e.hp>0});
  if(!boss)return;
  var pct=Math.max(0,boss.hp/boss.maxHp*100);
  document.getElementById('boss-hp').style.width=pct+'%';
}

function onWaveCleared(){
  var biome=BIOME_DEFS[G.run.biome];
  var maxWave=biome.wavesPerLevel;
  var maxLevel=biome.levels;

  G.wavesCleared++;
  dlog('wave cleared, Lv'+G.run.currentLevel+' W'+G.run.currentWave+'/'+maxWave);

  // Check if boss was killed (wave 20 of last level)
  if(G.run.currentWave>=maxWave && G.run.currentLevel>=maxLevel){
    // BIOME COMPLETE!
    G.run.completed=true;
    document.getElementById('boss-hp-container').classList.remove('active');
    showBigLabel('BIOME COMPLETE!','#F1C40F','Victory!');
    setTimeout(function(){gameOver(true)},2500);
    return;
  }

  // Check if level clear (wave 20)
  if(G.run.currentWave>=maxWave){
    // Level complete! Open backpack
    G.run.currentLevel++;
    G.run.currentWave=1;
    document.getElementById('boss-hp-container').classList.remove('active');
    document.getElementById('combat-slot-panel').classList.remove('active');
    document.getElementById('distance-labels').classList.remove('active');
    showBigLabel('LEVEL '+(G.run.currentLevel-1)+' COMPLETE!','#3498DB','Prepare for Level '+G.run.currentLevel);
    setTimeout(function(){
      // Generate loot for level transition
      G._lootItems=[];
      for(var i=0;i<3;i++)G._lootItems.push(randomWeapon(G.run.currentLevel));
      openBpOverlay();
    },1500);
    return;
  }

  // Normal wave transition: just go to next wave (no backpack!)
  G.run.currentWave++;
  showNotif('WAVE '+(G.run.currentWave-1)+' CLEARED','#2ECC71');

  // Check level up pending
  if(G._levelUpPending){
    setTimeout(function(){showLevelUpChoice()},300);
    return;
  }

  // Auto-start next wave after short pause
  document.getElementById('combat-slot-panel').classList.remove('active');
  document.getElementById('distance-labels').classList.remove('active');
  setTimeout(function(){startWalking()},500);
}

// ===================== COMBAT SLOT SYSTEM (5 reels) =====================
function getReelWeapons(colIdx){
  var seen=new Set();var weapons=[];
  for(var r=0;r<GROWS;r++){
    var uid=G.grid[r*GCOLS+colIdx];
    if(uid&&!seen.has(uid)){
      seen.add(uid);
      var w=G.placed.get(uid);
      if(w)weapons.push(w);
    }
  }
  return weapons;
}

function startCombatSlots(){
  G._turnPhase='slots_spinning';
  G._combatSlots={results:new Array(GCOLS).fill(null),resolved:0,reels:[]};
  G._comboMult=1;G._comboWeapons={};
  var panel=document.getElementById('combat-slot-panel');panel.classList.add('active');
  var reelsEl=document.getElementById('combat-reels');reelsEl.innerHTML='';
  document.getElementById('attack-btn').disabled=true;
  document.getElementById('reroll-btn').disabled=true;
  document.getElementById('combo-indicator').className='';
  document.getElementById('combo-indicator').textContent='';

  var indicator=document.getElementById('turn-indicator');
  indicator.textContent='YOUR TURN';indicator.className='active player-turn';

  for(var i=0;i<GCOLS;i++){
    var reel=document.createElement('div');reel.className='combat-reel spinning';reel.id='creel-'+i;
    var weapons=getReelWeapons(i);
    reel.innerHTML='<span class="cr-icon">?</span><span class="cr-name">...</span>';
    (function(idx){
      reel.addEventListener('click',function(){rerollSingleReel(idx)});
    })(i);
    reelsEl.appendChild(reel);
    G._combatSlots.reels.push({
      col:i,weapons:weapons,tickTimer:0,tickIdx:0,stopped:false,
      speed:1,slowing:false,slowStart:0
    });
  }
  // Staggered stop
  for(var ri=0;ri<GCOLS;ri++){
    (function(idx){
      setTimeout(function(){
        if(G._combatSlots&&G._combatSlots.reels[idx])
          G._combatSlots.reels[idx].slowing=true;
      },600+idx*250);
    })(ri);
  }
}

function updateCombatSlotAnim(dt){
  if(!G._combatSlots)return;
  if(G._turnPhase!=='slots_spinning')return;
  for(var i=0;i<G._combatSlots.reels.length;i++){
    var r=G._combatSlots.reels[i];
    if(r.stopped||r.weapons.length===0){
      if(!r.stopped)stopCombatReel(i);
      continue;
    }
    if(r.slowing){r.slowStart+=dt;r.speed=Math.max(1-r.slowStart*2.5,0)}
    var interval=0.035+0.12*(1-r.speed);
    r.tickTimer+=dt;
    if(r.tickTimer>=interval){
      r.tickTimer=0;
      r.tickIdx=(r.tickIdx+1)%r.weapons.length;
      var w=r.weapons[r.tickIdx];
      var el=document.getElementById('creel-'+i);
      if(el){
        el.querySelector('.cr-icon').textContent=w.icon;
        el.querySelector('.cr-name').textContent=w.name;
      }
      sfxSlotTick(r.speed<0.3?2:0);
    }
    if(r.speed<=0)stopCombatReel(i);
  }
}

function stopCombatReel(idx){
  if(!G._combatSlots)return;
  var r=G._combatSlots.reels[idx];
  if(r.stopped)return;r.stopped=true;
  var el=document.getElementById('creel-'+idx);if(!el)return;
  el.classList.remove('spinning');
  if(r.weapons.length===0){
    G._combatSlots.results[idx]=null;
    el.classList.add('empty-result','landed-empty');
    el.innerHTML='<span class="cr-icon" style="font-size:28px;color:var(--red)">✕</span><span class="cr-name" style="color:var(--red)">empty</span>';
    sfxSlotFail();
  }else{
    var picked=r.weapons[r.tickIdx%r.weapons.length];
    G._combatSlots.results[idx]=picked;
    el.classList.add('resolved','landed');
    var tc=tierColor(picked.tier);
    el.innerHTML='<span class="cr-icon" style="font-size:28px">'+picked.icon+'</span>'
      +'<span class="cr-name" style="color:'+tc+';font-weight:700">'+picked.name+'</span>'
      +'<span class="cr-tier" style="color:'+tc+'">T'+picked.tier+'</span>';
    sfxSlotResolve();
  }
  G._combatSlots.resolved++;
  if(G._combatSlots.resolved>=GCOLS)finishCombatSlots();
}

function finishCombatSlots(){
  G._turnPhase='player_choose';
  // Detect combo
  var counts={};
  for(var i=0;i<G._combatSlots.results.length;i++){
    var w=G._combatSlots.results[i];
    if(!w)continue;
    if(!counts[w.uid])counts[w.uid]={weapon:w,count:0};
    counts[w.uid].count++;
  }
  G._comboWeapons=counts;
  var maxCombo=0;
  for(var uid in counts){if(counts[uid].count>maxCombo)maxCombo=counts[uid].count}
  G._comboMult=COMBO_MULT[maxCombo]||1;

  // Show combo indicator
  var comboEl=document.getElementById('combo-indicator');
  if(maxCombo>=2){
    comboEl.textContent='COMBO ×'+maxCombo+'! (×'+G._comboMult+' DMG)';
    comboEl.className='active';
    for(var i=0;i<G._combatSlots.results.length;i++){
      var w=G._combatSlots.results[i];
      if(w&&counts[w.uid]&&counts[w.uid].count>=2){
        var el=document.getElementById('creel-'+i);
        if(el)el.classList.add('combo-match');
      }
    }
  }

  // Enable buttons
  document.getElementById('attack-btn').disabled=false;
  updateRerollBtn();

  // Autobattle: auto-attack after short delay
  if(G.autobattle){
    setTimeout(function(){
      if(G._turnPhase==='player_choose')executeCombatAttack();
    },500);
  }
}

function detectCombo(results){
  var counts={};
  for(var i=0;i<results.length;i++){
    if(!results[i])continue;
    var uid=results[i].uid;
    counts[uid]=(counts[uid]||0)+1;
  }
  var max=0;
  for(var uid in counts){if(counts[uid]>max)max=counts[uid]}
  return COMBO_MULT[max]||1;
}

function updateRerollBtn(){
  var btn=document.getElementById('reroll-btn');
  btn.textContent='TAP REEL ⟳ '+G.rerollCharges+'/'+G.rerollMax;
  btn.disabled=true;
  for(var i=0;i<GCOLS;i++){
    var el=document.getElementById('creel-'+i);
    if(el){
      if(G.rerollCharges>0&&G._turnPhase==='player_choose'&&G._combatSlots&&G._combatSlots.reels[i].weapons.length>0){
        el.style.cursor='pointer';
      }else{
        el.style.cursor='default';
      }
    }
  }
}

function rerollCombatSlots(){
  if(G.rerollCharges<=0||G._turnPhase!=='player_choose')return;
  for(var i=0;i<GCOLS;i++){
    if(G._combatSlots&&G._combatSlots.results[i]!==null){
      rerollSingleReel(i);return;
    }
  }
}

function rerollSingleReel(idx){
  if(G._turnPhase!=='player_choose')return;
  if(G.rerollCharges<=0){showNotif('NO REROLLS LEFT','#888');return}
  if(!G._combatSlots||!G._combatSlots.reels[idx])return;
  var r=G._combatSlots.reels[idx];
  if(r.weapons.length===0)return;

  G.rerollCharges--;
  updateRerollBtn();

  r.stopped=false;r.speed=1;r.slowing=false;r.slowStart=0;r.tickTimer=0;
  G._combatSlots.results[idx]=null;
  G._combatSlots.resolved--;

  var el=document.getElementById('creel-'+idx);
  if(el){
    el.className='combat-reel spinning';
    el.innerHTML='<span class="cr-icon">?</span><span class="cr-name">...</span>';
  }

  G._turnPhase='slots_spinning';
  document.getElementById('attack-btn').disabled=true;

  setTimeout(function(){
    if(G._combatSlots&&G._combatSlots.reels[idx])
      G._combatSlots.reels[idx].slowing=true;
  },500);
}

function toggleAutobattle(){
  G.autobattle=document.getElementById('autobattle-cb').checked;
  if(G.autobattle&&G._turnPhase==='player_choose'){
    setTimeout(function(){
      if(G._turnPhase==='player_choose')executeCombatAttack();
    },300);
  }
}

function executeCombatAttack(){
  if(G._turnPhase!=='player_choose')return;
  G._turnPhase='player_attack';
  document.getElementById('attack-btn').disabled=true;
  document.getElementById('reroll-btn').disabled=true;

  var target=getAtkTarget();
  if(!target){
    G._turnPhase='idle';
    showNotif('NO TARGET','#888');
    document.getElementById('attack-btn').disabled=false;
    updateRerollBtn();
    return;
  }

  var totalDmg=0;
  var weaponHits=[];
  var maxComboCount=0;
  var maxComboTier=1;

  // Find the max combo for XP calculation
  for(var uid in G._comboWeapons){
    var info=G._comboWeapons[uid];
    if(info.count>maxComboCount){
      maxComboCount=info.count;
      maxComboTier=info.weapon.tier;
    }
  }

  for(var i=0;i<G._combatSlots.results.length;i++){
    var w=G._combatSlots.results[i];
    if(!w)continue;
    var stats=computeFinalStats(w);
    var distMul=w.distanceCurve[target.distance]||0.5;
    var dmg=stats.damage*distMul*G._comboMult;
    // Crit check
    var isCrit=Math.random()<stats.crit;
    if(isCrit)dmg*=2;
    // Perk bonus
    var perk=w.perks[w.tier];
    if(perk==='cleave_1')dmg*=1.2;
    if(perk==='cleave_2')dmg*=1.4;
    if(perk==='pierce_1')dmg*=1.15;
    if(perk==='pierce_2')dmg*=1.3;
    if(perk==='aoe_radius_1'||perk==='aoe_radius_2'){/* AoE visual only */}
    if(perk==='bleed')dmg*=1.1;
    if(perk==='bleed_strong')dmg*=1.25;
    totalDmg+=dmg;
    weaponHits.push({weapon:w,dmg:dmg,crit:isCrit});
  }

  // Minimum fist damage if nothing hit
  if(totalDmg===0){
    totalDmg=G.hero.damage*0.5;
    weaponHits.push({weapon:{icon:'👊',name:'Fist'},dmg:totalDmg,crit:false});
  }

  // Apply damage
  target.hp-=totalDmg;G.totalDamage+=totalDmg;
  target._hitFlash=1;target._hitShakeX=(Math.random()-0.5)*12;target._hitShakeY=(Math.random()-0.5)*8;

  // VFX
  var pos=enemyScreenPos(target);
  for(var i=0;i<weaponHits.length;i++){
    var h=weaponHits[i];
    var floatColor=tierColor(h.weapon.tier||1);
    // Frost skill: blue tint on damage numbers
    if(hasActiveSkill('frost')&&h.weapon.tags&&h.weapon.tags.indexOf('Ranged')>=0){
      floatColor='#74B9FF';
    }
    addFloat(target,Math.ceil(h.dmg),floatColor,h.crit);
  }
  if(weaponHits.some(function(h){return h.crit}))sfxCrit();else sfxHit();
  shake(4,0.15);

  // Vampirism skill: heal hero for value% of damage dealt
  if(hasActiveSkill('vampirism')){
    var lifestealVal=getActiveSkillValue('vampirism');
    var heal=Math.floor(totalDmg*lifestealVal);
    if(heal>0){
      G.hero.hp=Math.min(G.hero.hp+heal,G.hero.maxHp);
      if(heal>5)showNotif('+'+heal+' HP (lifesteal)','#2ECC71');
    }
  }

  // Combo XP (Stage 2 formula): 5 * COMBO_XP_MUL[comboCount] * TIER_XP_MUL[tier]
  // Only on final attack (not reroll), capped at 200 per wave
  if(maxComboCount>=2){
    var comboXp=Math.floor(5*(COMBO_XP_MUL[maxComboCount]||1)*(TIER_XP_MUL[maxComboTier]||1));
    comboXp=Math.min(comboXp,200-G.run.waveXpThisTurn);
    if(comboXp>0){
      G.run.waveXpThisTurn+=comboXp;
      gainRunXp(comboXp);
    }
  }

  // Legacy hero XP from combo
  if(G._comboMult>1){
    var heroXp=Math.floor(5*G._comboMult*tierEffMul(weaponHits[0]?weaponHits[0].weapon.tier:1)*0.3);
    gainExp(heroXp);
  }

  // Check enemy death
  if(target.hp<=0){
    target.hp=0;target.opacity=0;
    onEnemyDeath(target);
  }

  // Enemy turn after delay
  setTimeout(function(){enemyTurnAttack()},1000);
}

function getAtkTarget(){
  if(G.targetEnemy&&G.targetEnemy.hp>0)return G.targetEnemy;
  var alive=G.enemies.filter(function(e){return e.hp>0});
  if(alive.length===0)return null;
  var priority={close:0,mid:1,far:2};
  alive.sort(function(a,b){return(priority[a.distance]||1)-(priority[b.distance]||1)});
  return alive[0];
}

function onEnemyDeath(e){
  G.kills++;
  // Kill XP for run progression
  var killXp=e.type==='boss'?50:e.type==='elite'?10:e.type==='ranged'?2:1;
  gainRunXp(killXp);
  // Legacy hero XP
  var heroXp=e.type==='boss'?50:e.type==='elite'?10:3;
  gainExp(heroXp);
  sfxDeath();
  G.effects.push({x:enemyScreenPos(e).x,y:enemyScreenPos(e).y,radius:30,color:'#F1C40F',timer:0.5,maxTimer:0.5});
  showNotif(e.type.toUpperCase()+' KILLED!','#2ECC71');
  if(G.targetEnemy===e)G.targetEnemy=null;
}

function enemyTurnAttack(){
  G._turnPhase='enemy_attack';
  var indicator=document.getElementById('turn-indicator');
  indicator.textContent='ENEMY TURN';indicator.className='active enemy-turn';

  var alive=G.enemies.filter(function(e){return e.hp>0});
  if(alive.length===0){endTurn();return}

  // Close enemies hit immediately, ranged/mid/far fire projectiles
  var immediateDmg=0;var immediateHits=0;
  var projectileEnemies=[];

  for(var i=0;i<alive.length;i++){
    var e=alive[i];
    var hitChance=e.distance==='close'?0.8:e.distance==='mid'?0.6:0.4;
    if(Math.random()<hitChance){
      if(e.distance==='close'){
        immediateDmg+=e.damage;immediateHits++;
      }else{
        projectileEnemies.push(e);
      }
    }
  }

  // Apply close-range damage immediately
  if(immediateDmg>0){
    heroDamage(immediateDmg);
    sfxHeroDamage();G._heroDmgFlash=1;shake(4,0.15);
    showNotif(immediateHits+' MELEE HIT'+(immediateHits>1?'S':'')+'! -'+Math.ceil(immediateDmg)+' HP','#E74C3C');
  }

  // Fire projectiles from ranged enemies
  if(projectileEnemies.length>0){
    for(var i=0;i<projectileEnemies.length;i++){
      fireEnemyProjectile(projectileEnemies[i]);
    }
    // Delay end turn to let projectiles fly
    var flyTime=600+projectileEnemies.length*100;
    setTimeout(function(){
      // Apply ranged damage when projectiles "hit"
      var rangedDmg=0;
      for(var i=0;i<projectileEnemies.length;i++)rangedDmg+=projectileEnemies[i].damage;
      if(rangedDmg>0){
        heroDamage(rangedDmg);
        sfxHeroDamage();G._heroDmgFlash=1;shake(3,0.1);
        showNotif(projectileEnemies.length+' RANGED HIT! -'+Math.ceil(rangedDmg)+' HP','#E74C3C');
      }
      setTimeout(function(){endTurn()},400);
    },flyTime);
  }else{
    if(immediateDmg===0)showNotif('ENEMIES MISSED','#888');
    setTimeout(function(){endTurn()},800);
  }
}

function fireEnemyProjectile(enemy){
  var pos=enemyScreenPos(enemy);
  var targetX=CW*0.5;
  var targetY=CH*0.85;
  var dx=targetX-pos.x;var dy=targetY-pos.y;
  var dist=Math.sqrt(dx*dx+dy*dy);
  var speed=500;
  var life=dist/speed;
  var color=enemy.type==='elite'?'#cc88ff':enemy.type==='boss'?'#ffaa44':'#74B9FF';
  G.projectiles.push({
    x:pos.x,y:pos.y,
    vx:dx/life,vy:dy/life,
    life:life,color:color,
    size:5
  });
}

function endTurn(){
  var alive=G.enemies.filter(function(e){return e.hp>0});
  if(alive.length===0){
    G._turnPhase='idle';return;
  }
  setTimeout(function(){startCombatSlots()},400);
}

function heroDamage(amount){
  G.hero.hp-=amount;
  G._heroDmgFlash=1;shake(5,0.2);sfxHeroDamage();
  if(G.hero.hp<=0){G.hero.hp=0;gameOver(false)}
  updateHUD();
}

// ===================== UI HELPERS =====================
function addFloat(e,dmg,color,crit){
  var pos=enemyScreenPos(e);
  var el=document.createElement('div');el.className='float-text'+(crit?' crit':'');
  el.style.left=(pos.x-20+Math.random()*40)+'px';
  el.style.top=(pos.y-pos.imgH/2)+'px';
  el.style.fontSize=(crit?'24px':'18px');
  el.style.color=color;
  el.textContent=(crit?'CRIT ':'')+(dmg>=1000?Math.floor(dmg/100)/10+'K':dmg);
  document.getElementById('game').appendChild(el);

}

function showBigLabel(main,color,sub){
  var el=document.createElement('div');el.className='big-label';
  el.innerHTML='<div class="bl-main" style="color:'+color+'">'+main+'</div>'
    +(sub?'<div class="bl-sub" style="color:'+color+'">'+sub+'</div>':'');
  document.getElementById('game').appendChild(el);

function showNotif(text,color){

  el.textContent=text;document.getElementById('game').appendChild(el);

}

function showLevelUp(){

  document.getElementById('game').appendChild(flash);setTimeout(function(){flash.remove()},1500);
  var txt=document.createElement('div');txt.className='level-up-text';txt.textContent='LEVEL UP!';

function shake(a,d){G.shakeAmount=a;G.shakeTime=d}

function showTransition(title,desc){
  document.getElementById('trans-title').textContent=title;
  document.getElementById('trans-desc').textContent=desc;
  document.getElementById('transition-overlay').classList.add('active');
}
function hideTransition(){document.getElementById('transition-overlay').classList.remove('active')}

function updateHUD(){

  bar.style.background=pct>60?'linear-gradient(90deg,#27AE60,#2ECC71)':pct>30?'linear-gradient(90deg,#F39C12,#F1C40F)':'linear-gradient(90deg,#C0392B,#E74C3C)';
  document.getElementById('hp-text').textContent=Math.ceil(hp)+'/'+maxHp;

function updateExpBar(){
  updateRunXpBar();
}

function updateWaveCounter(){
  var biome=BIOME_DEFS[G.run.biome];
  document.getElementById('wave-counter').textContent='Lv'+G.run.currentLevel+' W'+G.run.currentWave+'/'+biome.wavesPerLevel;
