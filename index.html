// ===================== BACKPACK OVERLAY =====================
function openBpOverlay(){
  G.sub='backpack';
  var lobby=document.getElementById('lobby');lobby.classList.add('active');
  renderLobby();
  if(G._lootItems&&G._lootItems.length>0)showLootDrop();
  startBgm('prep');
}

function closeBpOverlay(){
  var lobby=document.getElementById('lobby');lobby.classList.remove('active');
  hideLootDrop();
  startWalking();
}

function showLootDrop(){
  document.getElementById('loot-drop').classList.add('active');
  rerenderLootCards();
}

function rerenderLootCards(){
  var container=document.getElementById('loot-cards');container.innerHTML='';
  for(var i=0;i<G._lootItems.length;i++){
    var w=G._lootItems[i];
    var card=document.createElement('div');card.className='loot-card';
    card.style.borderColor=tierColor(w.tier);
    var shape=getShape(w);var bounds=shapeBounds(shape);
    var shapeGrid='<div class="lc-shape" style="grid-template-columns:repeat('+bounds.w+',6px)">';
    for(var r=0;r<bounds.h;r++)for(var c=0;c<bounds.w;c++){
      var has=shape.some(function(p){return p[0]===c&&p[1]===r});
      shapeGrid+='<div class="lc-shape-cell" style="background:'+(has?tierColor(w.tier):'transparent')+'"></div>';
    }
    shapeGrid+='</div>';
    card.innerHTML='<div class="lc-icon">'+w.icon+'</div><div class="lc-name">'+w.name+'</div>'
      +'<div class="lc-tier" style="color:'+tierColor(w.tier)+'">T'+w.tier+' '+TIER_NAMES[w.tier]+'</div>'+shapeGrid;
    (function(weapon){
      card.addEventListener('mousedown',function(e){startDrag(e,weapon,'loot')});
      card.addEventListener('touchstart',function(e){startDrag(e,weapon,'loot')});
    })(w);
    container.appendChild(card);
  }
}

function onLootItemPlaced(weapon){
  G._lootItems=G._lootItems.filter(function(w){return w.uid!==weapon.uid});
  rerenderLootCards();
  if(G._lootItems.length===0)hideLootDrop();
}

function resummonLoot(){
  G._lootItems=[];
  for(var i=0;i<3;i++)G._lootItems.push(randomWeapon(G.run.currentLevel));
  rerenderLootCards();
}

function hideLootDrop(){document.getElementById('loot-drop').classList.remove('active')}

// ===================== GRID RENDERING =====================
function renderLobby(){renderGrid()}

function renderGrid(){
  var container=document.getElementById('grid-container');
  container.style.gridTemplateColumns='repeat('+GCOLS+',min(50px,16vw))';
  container.innerHTML='';
  for(var r=0;r<GROWS;r++){
    for(var c=0;c<GCOLS;c++){
      var cell=document.createElement('div');cell.className='grid-cell';
      cell.dataset.col=c;cell.dataset.row=r;
      if(isHeroCell(c,r)){
        cell.classList.add('hero-cell');
        if(c===2&&r===2)cell.innerHTML='<div class="cell-icon">👤</div>';
        else if(c===3&&r===2)cell.innerHTML='<div class="cell-icon" style="font-size:10px;color:var(--gold)">HERO</div>';
        container.appendChild(cell);continue;
      }
      var uid=G.grid[r*GCOLS+c];
      if(uid){
        var w=G.placed.get(uid);
        if(w){
          var tc=tierColor(w.tier);
          cell.style.background=tierColorRgba(w.tier,0.15);
          cell.style.borderColor=tierColorRgba(w.tier,0.5);
          var shape=w.placedShape||getShape(w);
          var localC=c-w.anchorCol,localR=r-w.anchorRow;
          if(shape.some(function(p){return p[0]===localC+1&&p[1]===localR}))cell.classList.add('merge-right');
          if(shape.some(function(p){return p[0]===localC&&p[1]===localR+1}))cell.classList.add('merge-bottom');
          if(shape.some(function(p){return p[0]===localC-1&&p[1]===localR}))cell.classList.add('merge-left');
          if(shape.some(function(p){return p[0]===localC&&p[1]===localR-1}))cell.classList.add('merge-top');
          var center=getShapeCenter(shape);
          if(localC===center[0]&&localR===center[1]){
            cell.innerHTML='<div class="cell-icon">'+w.icon+'</div><div class="cell-tier" style="color:'+tc+'">T'+w.tier+'</div><div class="cell-name">'+w.name+'</div>';
          }
        }
      }
      (function(col,row){
        cell.addEventListener('mousedown',function(e){
          var uid=G.grid[row*GCOLS+col];if(!uid)return;
          var w=G.placed.get(uid);if(!w)return;startDrag(e,w,'grid');
        });
        cell.addEventListener('touchstart',function(e){
          var uid=G.grid[row*GCOLS+col];if(!uid)return;
          var w=G.placed.get(uid);if(!w)return;startDrag(e,w,'grid');
        });
        cell.addEventListener('click',function(e){
          var uid=G.grid[row*GCOLS+col];if(!uid)return;
          var w=G.placed.get(uid);if(!w)return;
          showInfluencePattern(w);
        });
      })(c,r);
      container.appendChild(cell);
    }
  }
}

function showInfluencePattern(weapon){
  document.querySelectorAll('.grid-cell.influence-zone,.grid-cell.influence-source').forEach(function(c){
    c.classList.remove('influence-zone','influence-source');
    var fl=c.querySelector('.influence-float');if(fl)fl.remove();
  });
  var shape=weapon.placedShape||getShape(weapon);
  for(var i=0;i<shape.length;i++){
    var sc=weapon.anchorCol+shape[i][0],sr=weapon.anchorRow+shape[i][1];
    var el=document.querySelector('.grid-cell[data-col="'+sc+'"][data-row="'+sr+'"]');
    if(el)el.classList.add('influence-source');
  }
  var zone=getInfluenceCells(weapon);
  for(var i=0;i<zone.length;i++){
    var el=document.querySelector('.grid-cell[data-col="'+zone[i].col+'"][data-row="'+zone[i].row+'"]');
    if(el){
      el.classList.add('influence-zone');
      var uid=G.grid[zone[i].row*GCOLS+zone[i].col];
      if(uid){
        var eff=weapon.zoneEffect;
        var label=eff.type==='atk_per_match'?'+'+Math.round(eff.value*100)+'% ATK':'+'+Math.round(eff.value*100)+'% CRIT';
        var fl=document.createElement('div');fl.className='influence-float';fl.textContent=label;
        el.appendChild(fl);
      }
    }
  }
  setTimeout(function(){
    document.querySelectorAll('.grid-cell.influence-zone,.grid-cell.influence-source').forEach(function(c){
      c.classList.remove('influence-zone','influence-source');
      var fl=c.querySelector('.influence-float');if(fl)fl.remove();
    });
  },3000);
}

// ===================== MERGE VFX =====================
function spawnMergeVFX(weapon){
  var shape=weapon.placedShape||getShape(weapon);
  var center=getShapeCenter(shape);
  var cc=weapon.anchorCol+center[0],cr=weapon.anchorRow+center[1];
  var cellEl=document.querySelector('.grid-cell[data-col="'+cc+'"][data-row="'+cr+'"]');
  if(!cellEl)return;
  cellEl.classList.add('merge-flash');
  setTimeout(function(){cellEl.classList.remove('merge-flash')},700);
  var rect=cellEl.getBoundingClientRect();
  var cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  for(var i=0;i<8;i++){
    var angle=Math.PI*2*i/8;
    var dist=30+Math.random()*20;
    var p=document.createElement('div');p.className='merge-particle';
    p.style.left=cx+'px';p.style.top=cy+'px';
    p.style.background=tierColor(weapon.tier);
    p.style.setProperty('--mx',Math.cos(angle)*dist+'px');
    p.style.setProperty('--my',Math.sin(angle)*dist+'px');
    document.body.appendChild(p);setTimeout((function(el){return function(){el.remove()}})(p),600);
  }
  var badge=document.createElement('div');badge.className='merge-badge';
  badge.style.left=cx+'px';badge.style.top=cy+'px';
  badge.style.color=tierColor(weapon.tier);
  badge.textContent='T'+weapon.tier+'!';
  document.body.appendChild(badge);setTimeout(function(){badge.remove()},1000);
}

// ===================== DRAG & DROP =====================
var dragWeapon=null,dragFrom=null,dragGhost=null,isDragging=false,dragStartPos=null,dragRotation=0;

function startDrag(e,weapon,from,fromData){
  e.preventDefault();e.stopPropagation();
  var pos=e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};
  dragStartPos=pos;isDragging=false;
  dragWeapon=weapon;dragFrom={type:from,data:fromData};
  dragRotation=weapon.rotation||0;
  var pickupData=null;
  if(from==='grid'){
    pickupData={col:weapon.anchorCol,row:weapon.anchorRow,shape:weapon.placedShape?[].concat(weapon.placedShape):[]};
    removeWeapon(weapon.uid);
  }

  var moveH=function(me){
    var mp=me.touches?{x:me.touches[0].clientX,y:me.touches[0].clientY}:{x:me.clientX,y:me.clientY};
    if(!isDragging){
      if(Math.sqrt((mp.x-dragStartPos.x)*(mp.x-dragStartPos.x)+(mp.y-dragStartPos.y)*(mp.y-dragStartPos.y))<6)return;
      isDragging=true;createDragGhost();
    }
    if(dragGhost){dragGhost.style.left=mp.x+'px';dragGhost.style.top=mp.y+'px'}
    showDropPreview(mp);
  };
  var upH=function(ue){
    document.removeEventListener('mousemove',moveH);document.removeEventListener('touchmove',moveH);
    document.removeEventListener('mouseup',upH);document.removeEventListener('touchend',upH);
    clearDropPreview();
    if(dragGhost){dragGhost.remove();dragGhost=null}
    if(!isDragging){
      if(from==='grid'){placeWeapon(weapon,pickupData.col,pickupData.row);weapon.rotation=dragRotation}
      dragWeapon=null;dragFrom=null;renderLobby();return;
    }
    var up=ue.changedTouches?{x:ue.changedTouches[0].clientX,y:ue.changedTouches[0].clientY}:{x:ue.clientX,y:ue.clientY};
    var cell=getCellFromPoint(up.x,up.y);
    var placed=false;

    if(cell){
      weapon.rotation=dragRotation;
      var shape=getShape(weapon);
      var anchor=getAnchorFromCursor(shape,cell);

      // Merge detection
      var targetUid=G.grid[cell.row*GCOLS+cell.col];
      if(targetUid&&weapon.tier<5){
        var target=G.placed.get(targetUid);
        if(target&&target.defId===weapon.defId&&target.tier===weapon.tier){
          var mergeCol=target.anchorCol,mergeRow=target.anchorRow;
          removeWeapon(targetUid);
          weapon.tier+=1;weapon.rotation=0;
          var newShape=getShape(weapon);
          var mergePlaced=false;
          if(canPlace(newShape,mergeCol,mergeRow)){
            weapon.placedShape=newShape;placeWeapon(weapon,mergeCol,mergeRow);mergePlaced=true;placed=true;
          }
          if(!mergePlaced){
            for(var mr=0;mr<GROWS&&!mergePlaced;mr++){
              for(var mc=0;mc<GCOLS&&!mergePlaced;mc++){
                if(canPlace(newShape,mc,mr)){
                  weapon.placedShape=newShape;placeWeapon(weapon,mc,mr);mergePlaced=true;placed=true;
                }
              }
            }
            if(!placed)weapon.tier-=1;
          }
          if(placed){
            if(from==='loot')onLootItemPlaced(weapon);
            showNotif('MERGE! '+weapon.name+' → T'+weapon.tier+' '+TIER_NAMES[weapon.tier],tierColor(weapon.tier));
            gainExp([5,15,45,135][weapon.tier-2]||5);
            renderLobby();setTimeout(function(){spawnMergeVFX(weapon)},50);
          }
        }
      }

      // Normal placement
      if(!placed&&canPlace(shape,anchor.col,anchor.row)){
        weapon.placedShape=shape;placeWeapon(weapon,anchor.col,anchor.row);
        if(from==='loot')onLootItemPlaced(weapon);
        placed=true;
      }
    }
    if(!placed){
      if(from==='grid'){placeWeapon(weapon,pickupData.col,pickupData.row)}
    }
    dragWeapon=null;dragFrom=null;isDragging=false;renderLobby();
  };
  document.addEventListener('mousemove',moveH);document.addEventListener('touchmove',moveH,{passive:false});
  document.addEventListener('mouseup',upH);document.addEventListener('touchend',upH);
}

function createDragGhost(){
  if(dragGhost)dragGhost.remove();
  var w=dragWeapon;w.rotation=dragRotation;
  var shape=getShape(w),bounds=shapeBounds(shape);
  var center=getShapeCenter(shape);
  var ghost=document.createElement('div');ghost.id='drag-ghost';
  ghost.style.gridTemplateColumns='repeat('+bounds.w+','+CSZ+'px)';
  var offX=-(center[0]*(CSZ+CGAP)+CSZ/2);var offY=-(center[1]*(CSZ+CGAP)+CSZ/2);
  ghost.style.transform='translate('+offX+'px,'+offY+'px)';
  var tc=tierColor(w.tier);
  for(var r=0;r<bounds.h;r++)for(var c=0;c<bounds.w;c++){
    var has=shape.some(function(p){return p[0]===c&&p[1]===r});
    var gc=document.createElement('div');gc.className='ghost-cell';
    if(has){
      gc.style.background=tierColorRgba(w.tier,0.6);gc.style.border='2px solid '+tc;
      if(c===center[0]&&r===center[1]){gc.classList.add('ghost-center');gc.textContent=w.icon}
    }else{gc.style.background='transparent';gc.style.border='none'}
    ghost.appendChild(gc);
  }
  document.body.appendChild(ghost);dragGhost=ghost;
}

function getCellFromPoint(px,py){
  var el=document.elementFromPoint(px,py);if(!el)return null;
  var cell=el.closest('.grid-cell');if(!cell)return null;
  return{col:parseInt(cell.dataset.col),row:parseInt(cell.dataset.row)};
}

function getAnchorFromCursor(shape,cell){
  var center=getShapeCenter(shape);
  return{col:cell.col-center[0],row:cell.row-center[1]};
}

function showDropPreview(mp){
  clearDropPreview();if(!dragWeapon)return;
  var cell=getCellFromPoint(mp.x,mp.y);if(!cell)return;
  var shape=getShape(dragWeapon);
  var anchor=getAnchorFromCursor(shape,cell);
  var valid=canPlace(shape,anchor.col,anchor.row);
  for(var i=0;i<shape.length;i++){
    var cc=anchor.col+shape[i][0],rr=anchor.row+shape[i][1];
    if(cc<0||cc>=GCOLS||rr<0||rr>=GROWS)continue;
    var cellEl=document.querySelector('.grid-cell[data-col="'+cc+'"][data-row="'+rr+'"]');
    if(cellEl)cellEl.classList.add(valid?'drop-valid':'drop-invalid');
  }
}

function clearDropPreview(){
  document.querySelectorAll('.grid-cell.drop-valid,.grid-cell.drop-invalid,.grid-cell.drop-empty').forEach(function(c){
    c.classList.remove('drop-valid','drop-invalid','drop-empty')});
}

// ===================== COMBAT INPUT =====================
canvas.addEventListener('click',function(e){
  if(G.phase!=='combat'||G.sub!=='fight')return;
  var rect=canvas.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  var alive=G.enemies.filter(function(en){return en.hp>0});
  for(var i=0;i<alive.length;i++){
    var pos=enemyScreenPos(alive[i]);
    var dx=x-pos.x,dy=y-pos.y;
    if(Math.abs(dx)<pos.imgW/2&&Math.abs(dy)<pos.imgH/2){
      G.targetEnemy=alive[i];
      showNotif('TARGET: '+alive[i].type.toUpperCase(),'#F1C40F');
      return;
    }
  }
});

document.addEventListener('keydown',function(e){
  if(e.key==='l'||e.key==='L'||e.key==='д'||e.key==='Д')dumpLog();
});

// ===================== GAMEOVER =====================
function gameOver(victory){
  G.phase='gameover';G._turnPhase='idle';
  document.getElementById('combat-slot-panel').classList.remove('active');
  document.getElementById('distance-labels').classList.remove('active');
  document.getElementById('boss-hp-container').classList.remove('active');
  stopBgm();
  var biome=BIOME_DEFS[G.run.biome];
  var stats=(victory?'VICTORY! BIOME COMPLETE!\n\n':'DEFEATED\n\n')
    +'Biome: '+biome.name+'\n'
    +'Level: '+G.run.currentLevel+'/'+biome.levels+'\n'
    +'Wave: '+G.run.currentWave+'/'+biome.wavesPerLevel+'\n'
    +'Run Level: '+G.run.runLevel+'\n'
    +'Kills: '+G.kills+'\n'
    +'Damage: '+Math.floor(G.totalDamage)+'\n'
    +'Skills: '+G.activeSkills.length;
  document.getElementById('go-stats').textContent=stats;
  document.getElementById('gameover').classList.add('active');
}

function restartGame(){
  document.getElementById('gameover').classList.remove('active');
  startGame();
}

// ===================== GAME LOOP =====================
function gameLoop(ts){
  if(!G.running)return;
  var dt=Math.min((ts-G.lastTime)/1000,0.1);G.lastTime=ts;
  if(G.phase==='combat'||G.phase==='transition'){
    drawCombat(dt);updateCombat(dt);
  }
  if(G._turnPhase==='slots_spinning')updateCombatSlotAnim(dt);
  dlogSnapshot(dt);
  requestAnimationFrame(gameLoop);
}

// ===================== START GAME =====================
function startGame(){
  initAudio();
  resizeCanvas();
  resetState();
  preloadBgm();

  loadAssets(function(){
    G.phase='combat';G.sub='backpack';G.running=true;

    // Generate starting weapons
    var startWeapons=[
      createWeapon('sword',1),
      createWeapon('dagger',1),
      createWeapon('bow',1),
    ];
    G._lootItems=startWeapons;

    // Show HUD
    document.getElementById('title-screen').style.display='none';
    document.getElementById('hud').style.display='flex';
    document.getElementById('exp-bar-container').style.display='block';
    updateHUD();updateRunXpBar();

    // Show first biome transition then open backpack
    var biome=BIOME_DEFS[G.run.biome];
    showTransition(biome.name+' - Level 1','Prepare your backpack!');
    setTimeout(function(){
      hideTransition();
      openBpOverlay();
    },1500);

    G.lastTime=performance.now();
    requestAnimationFrame(gameLoop);
  });
}
